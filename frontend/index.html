<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>AI Drive Assistant</title>
    <script src="script.js" defer></script>

    <!-- Tailwind CDN for clean UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-4xl mx-auto mt-10 bg-white shadow-lg p-8 rounded-xl">

        <h1 class="text-3xl font-bold text-center mb-6">
            AI Drive Assistant
        </h1>

        <!-- Input Section -->
        <label class="font-semibold">Enter your query:</label>
        <textarea id="queryInput"
            class="w-full p-3 border rounded-lg mt-2 mb-4"
            rows="3"
            placeholder="Example: Find my Java certificate"></textarea>

        <!-- Mode Selector -->
        <label class="font-semibold">Mode:</label>
        <select id="modeSelect"
                class="w-full p-3 border rounded-lg mt-2 mb-4">
            <option value="default">Default (Q/A)</option>
            <option value="summary">Summary</option>
        </select>

        <!-- Submit Button -->
        <button onclick="sendQuery()"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">
            Ask
        </button>

        <!-- Output -->
        <h2 class="text-xl font-bold mt-6">AI Answer:</h2>
        <div id="answerBox" class="p-4 bg-gray-50 border rounded-lg min-h-[80px]"></div>

        <h2 class="text-xl font-bold mt-6">Matched Drive Files:</h2>
        <div id="resultsBox" class="mt-2 space-y-3"></div>

    </div>

</body>
</html>
